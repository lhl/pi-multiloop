name: Test

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # package-lock.json is not committed, so this job installs from the
      # manifest instead of npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        timeout-minutes: 10
        run: npx vitest run

      # Records the platform-specific result behind the EPERM that suspended
      # Jouzu v0.1.4 Windows CI. Informational: the suite owns the assertion.
      - name: Directory fsync probe
        run: node scripts/dir-fsync-probe.mjs
