name: Publish

on:
  push:
    tags: ['v*']

# OIDC trusted publishing requires id-token; gh release create needs contents write.
permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm 11.5.1+ is required for OIDC trusted publishing. Install the
      # reviewed version into a side prefix to avoid replacing setup-node's npm.
      - name: Install recent npm
        run: |
          set -e
          mkdir -p /tmp/npm-latest
          npm install --prefix /tmp/npm-latest --no-audit --no-fund npm@11.16.0
          echo "/tmp/npm-latest/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Print toolchain versions
        run: |
          node --version
          which npm
          npm --version

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          echo "Publishing pi-multiloop@${PKG_VERSION}"

      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: npm publish --provenance --access public

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section from "## $VERSION " up to the next "## " heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "( |$)" {flag=1; next}
            flag && /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for ${VERSION}; falling back to a stub."
            printf "Release %s\n\nSee CHANGELOG.md for details.\n" "${GITHUB_REF_NAME}" > /tmp/release-notes.md
          fi
          echo "---release notes---"
          cat /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md
