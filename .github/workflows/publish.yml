name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# OIDC trusted publishing requires id-token; gh release create needs contents write.
permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm 11.5.1+ is required for OIDC trusted publishing. Node 22 LTS ships
      # with npm 10.x, so bump explicitly.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Print toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      # Refuse to publish if the tag does not match package.json. Skipped on
      # workflow_dispatch (no tag context), in which case we trust package.json.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          echo "Publishing pi-multiloop@${PKG_VERSION}"

      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: npm publish --provenance --access public

      - name: Extract changelog section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section from "## $VERSION " up to the next "## " heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "( |$)" {flag=1; next}
            flag && /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for ${VERSION}; falling back to a stub."
            printf "Release %s\n\nSee CHANGELOG.md for details.\n" "${GITHUB_REF_NAME}" > /tmp/release-notes.md
          fi
          echo "---release notes---"
          cat /tmp/release-notes.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md
